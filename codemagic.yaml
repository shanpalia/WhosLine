workflows:
  android-release:
    name: WhosLine Android Release
    instance_type: linux_x2
    environment:
      java: 17
      groups:
        - google_play
     android_signing:
  - paliaapk-release
    scripts:
      - name: Build signed release APK
        script: |
          ./gradlew assembleRelease
    artifacts:
      - app/build/outputs/**/*.apk
